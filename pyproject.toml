[project]
name = "sinac-truncation"
version = "0.1.0"
description = "Truncation bias in prenatal care measures and preterm birth (SINAC, Mexico)"
readme = "README.md"
authors = [
    { name = "martinruhle", email = "martinruhle@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# scripts/ is on the path as top-level modules, not as an installed package.
known-first-party = [
    "sinac_truncation",
    "download",
    "load_vocab",
    "pipeline",
    "sql_runner",
    "stage",
    "validate_concepts",
]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
# scripts/ holds top-level modules, so mypy resolves `import sql_runner` the same way
# Python does when pipeline.py runs.
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# Lets the tests import the runner that scripts/pipeline.py uses, not a copy of it.
pythonpath = ["scripts"]
markers = [
    "db: needs the compose database (`docker compose up -d --wait`)",
]

# The coverage floor (D-030) lives here, but the --cov flags are passed by CI: with them
# in addopts, a partial run such as `pytest -m db` would measure the whole package and
# fail on code its tests never touch.
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
