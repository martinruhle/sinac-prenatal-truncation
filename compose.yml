# Postgres database for the project's OMOP model; Adminer is optional, to inspect it.
#
#   cp .env.example .env
#   docker compose up -d                   # Postgres only
#   docker compose --profile dev up -d     # Postgres + Adminer
#
# Ports: only the ones somebody uses from the host are published, and only on 127.0.0.1 so the
# database is not exposed to the local network.
#   - Postgres: scripts/ and notebooks/ run on the host with `uv run`, outside Docker.
#   - Adminer:  it is opened from the browser.
# Adminer reaches Postgres over the internal Compose network (host "postgres"), not over the
# published port.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during initdb the image starts a temporary server that only listens on a
      # socket, so a socket check could report "healthy" before initialisation has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer
    profiles: ["dev"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
