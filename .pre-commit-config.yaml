# Local hooks: they use the versions in uv.lock, the same ones as CI and the terminal.
# Install once per clone:  uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # mypy takes the files from [tool.mypy] in pyproject.toml to see the whole project.
        pass_filenames: false
