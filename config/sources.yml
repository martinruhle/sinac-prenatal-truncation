# Provenance of every file this project does not write itself.
#
# vendored:  code or specifications copied into the repository from another project, pinned to a
#            commit. They are never edited here (see sql/ddl/ohdsi/SOURCE.md).
# downloads: the SSA/DGIS open-data files, with the URL including the `?V=` version parameter
#            DGIS publishes. `retrieved_at`, `size_bytes` and `sha256` are empty until the file
#            is first downloaded, and are then written by
#            `pipeline.py download --id <id> --record`. They are never overwritten afterwards:
#            if DGIS republishes a file, the hash stops matching and the command fails (D-044).
#
# Only the files the project actually uses are listed. The study period is still open (D-041), so
# these are the files the source inventory measures in order to close it: the 2019-2023 records,
# the two descriptors consulted for them (no descriptor is published for 2015-2019) and the
# catalogues of both catalogue periods.
# The 2024 and 2025 files are deliberately not listed (D-048). URLs, versions and the announced
# sizes are copied from the source page, not built.

