    publisher: Secretaría de Salud / Dirección General de Información en Salud (DGIS)
    description: SINAC birth records for 2023, one ZIP as published in DGIS open data.
    page: http://www.dgis.salud.gob.mx/contenidos/basesdedatos/da_nacimientos_gobmx.html
    url: http://www.dgis.salud.gob.mx/descargas/datosabiertos/nacimientos/sinac_2023.zip?V=2024.05.14
