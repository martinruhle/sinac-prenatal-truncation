    terms: http://www.dgis.salud.gob.mx/contenidos/basesdedatos/Datos_Abiertos_gobmx.html
    notes: >-
      Served over plain HTTP, without TLS: the sha256 detects any later change to the file, it
      does not authenticate the first download. The page states "Última modificación: Jueves 09
      de julio de 2026" and announces this file as 54.8 Mb, which does not match the 65,441,383
      bytes downloaded on 2026-09-20; the ZIP holds a single member, Nacimientos_2023.csv, with
      an internal date of 2024-05-08, consistent with the published version 2024.05.14. The
      announced size is recorded here as an observation and is not used for verification:
      `size_bytes` and `sha256` are what the file actually is. The "Términos y Condiciones"
      link of that page (http://www.dgis.salud.gob.mx/terminos) returns 404, so `terms` points
      at the Datos Abiertos page, which publishes the Términos de Libre Uso in full (D-046).
    # Written by `pipeline.py download --id dgis_sinac_2023 --record`; empty means not recorded.
