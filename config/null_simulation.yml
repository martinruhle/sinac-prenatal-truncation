# The seed and the scenarios of the null simulation (docs/protocol.md §Null simulation, D-096,
# D-097, D-112). scripts/simulate.py reads this file and config/nom007_schedule.yml, whose visits
# the simulation generates. The visits it writes are those of the model, not of SINAC, which
# records no visit date (CLAUDE.md rule 4).
#
# The seed is arbitrary: any integer gives a valid run, and fixing one makes two runs give the
# same output. It is 43, the number of the issue of task 1.7.1. Each scenario draws from a stream
# of its own, the child `stream` of the seed (a numpy SeedSequence spawn key), so adding a
# scenario does not change the draws of the others.

seed: 43

scenarios:
  # Every visit of the calendar from the first one until delivery.
  - id: e1
    name: Perfect calendar
    stream: 1
    misses: false
  # The first visit, then each later visit independently with probability p, which the run sets
  # from definition 2 and writes next to its output (D-096, FOR APPROVAL).
  - id: e2
    name: Calendar with misses
    stream: 2
    misses: true

# The first completed week of each trimester (docs/protocol.md §Trimester boundaries, D-092,
# FOR APPROVAL): the first trimester runs to 13 weeks, the second from 14 to 27 and the third
# from 28. A simulated pregnancy starts at the first visit of the calendar in its trimester.
# Rule 4 of the common set reads the same 28 (sql/cohorts/02_analysis.sql, apncu.py).
trimester_first_weeks:
  1: 0
  2: 14
  3: 28
