# Every concept_id the ETL and the cohort SQL use, and the local source vocabularies whose codes
# config/source_to_concept_map.csv maps. SQL never writes a concept_id (CLAUDE.md rule 8, D-023):
# it reads them from here or from source_to_concept_map.
#
# Each concept was looked up in Athena (athena.ohdsi.org) on the date below, and every one was
# Standard and Valid there. The fields are copied from Athena, not typed from memory:
#   concept_id, concept_name, vocabulary_id, concept_code, domain_id, standard_concept
# cdm_fields lists the CDM fields the concept is written to. The domain of a standard concept
# decides its table ("Write the data record into the table(s) corresponding to the domain of the
# Standard CONCEPT_ID", OMOP CDM data model conventions), so a concept written to
# <table>.<table>_concept_id must belong to that table's domain; tests/test_concepts.py checks it.
# Whether each concept exists, is valid and is standard in the vocabulary bundle actually loaded is
# checked by `pipeline.py validate-concepts` (task 1.4.3), not here.
#
# The rules that use each concept, and the alternatives that were rejected, are in
# docs/omop_mapping.md.

