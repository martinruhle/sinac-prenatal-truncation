# One source vocabulary per source column and catalogue period. The prefix SINAC20 is the
# 2020-2023 catalogue period (sinac_catalogos_2020_2023.zip and the 2020-2025 descriptor); a 2019
# adapter would add SINAC15 vocabularies instead of changing these (D-050). A source value listed
# in its column's vocabulary is a code and takes the row's target concept (0 when it is a flavor
# of null or has no standard concept); any other value of that column is the value itself (D-067).
# Each vocabulary is registered in VOCABULARY with vocabulary_concept_id = 0 (D-023).
#   defined_in:       where DGIS publishes the codes (a catalogue, or the descriptor)
#   cdm_field:        the CDM field the target concepts, or the values, go to
#   target_domain_id: the domain every non-zero target must have; null when all targets are 0
source_vocabularies:
  SINAC20_EDADGEST:
    source_column: EDADGESTACIONAL
    defined_in: descriptor
    cdm_field: measurement.value_as_number
    target_domain_id: null
  SINAC20_PRODEMB:
    source_column: PRODUCTOEMBARAZO
    defined_in: PRODUCTO_EMBARAZO
    cdm_field: measurement.value_as_number
    target_domain_id: null
  SINAC20_TOTCONS:
    source_column: TOTALCONSULTAS
    defined_in: descriptor
    cdm_field: observation.value_as_number
    target_domain_id: null
  SINAC20_TRIMCONS:
    source_column: TRIMESTREPRIMERCONSULTA
    defined_in: TRIMESTRE_PRIMER_CONSULTA
    cdm_field: observation.value_as_concept_id
    target_domain_id: Meas Value
  SINAC20_RESEXT:
    source_column: RESIDEEXTRANJERO
    defined_in: SI_NO
    cdm_field: location.country_concept_id
    target_domain_id: Geography
  SINAC20_ENTRES:
    source_column: ENTIDADRESIDENCIA
    defined_in: ENTIDADES
    cdm_field: location.state
    target_domain_id: null
  SINAC20_EDAD:
    source_column: EDAD
    defined_in: descriptor
    cdm_field: person.year_of_birth
    target_domain_id: null
  SINAC20_FECHANACMAD:
    source_column: FECHANACIMIENTOMADRE
    defined_in: descriptor
    cdm_field: person.year_of_birth
    target_domain_id: null
