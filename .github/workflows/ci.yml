name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv no publica etiquetas de versión mayor (no existe "v10"): va la versión completa.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # Toma la versión de Python de .python-version. No descarga datos: los tests usan fixtures
      # sintéticas.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest
