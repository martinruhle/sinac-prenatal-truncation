name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major-version tags (there is no "v10"): the full version goes here.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # Takes the Python version from .python-version. It downloads no data: the tests use
      # synthetic fixtures.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest
